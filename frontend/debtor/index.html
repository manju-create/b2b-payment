<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecoverFlow — Payment Recovery</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #F8FAFC; color: #1E293B; min-height: 100vh; display: flex; flex-direction: column; }

  /* Top bar */
  .topbar { background: #1E293B; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .topbar-logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
  .topbar-sub  { font-size: 13px; color: #94A3B8; margin-left: auto; }

  /* Invoice summary card */
  .invoice-card { background: #fff; border-bottom: 1px solid #E2E8F0; padding: 14px 20px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
  .inv-field { display: flex; flex-direction: column; gap: 2px; }
  .inv-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #64748B; }
  .inv-value { font-size: 15px; font-weight: 600; color: #1E293B; }
  .inv-value.overdue { color: #DC2626; }

  /* Chat area */
  .chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }

  /* Bubbles */
  .bubble-wrap { display: flex; align-items: flex-end; gap: 8px; max-width: 80%; }
  .bubble-wrap.agent  { align-self: flex-start; }
  .bubble-wrap.debtor { align-self: flex-end; flex-direction: row-reverse; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  .avatar.agent  { background: #E0E7FF; }
  .avatar.debtor { background: #DCFCE7; }
  .bubble { padding: 11px 15px; border-radius: 16px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .bubble.agent  { background: #F3F4F6; color: #1E293B; border-bottom-left-radius: 4px; }
  .bubble.debtor { background: #2563EB; color: #fff; border-bottom-right-radius: 4px; }

  /* Intent buttons */
  .intent-buttons { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 8px 38px; }
  .btn-intent { padding: 13px 20px; border-radius: 12px; border: none; cursor: pointer; font-size: 15px; font-weight: 600; font-family: 'Inter', sans-serif; transition: all 0.15s; display: flex; align-items: center; gap: 8px; }
  .btn-full    { background: #16A34A; color: #fff; }
  .btn-full:hover    { background: #15803D; transform: translateY(-1px); }
  .btn-partial { background: #fff; color: #2563EB; border: 2px solid #2563EB; }
  .btn-partial:hover { background: #EFF6FF; transform: translateY(-1px); }

  /* Plan confirmation card */
  .plan-card { background: #fff; border: 1px solid #E2E8F0; border-radius: 14px; padding: 18px; margin: 4px 0 8px 38px; max-width: 380px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .plan-title { font-size: 14px; font-weight: 700; color: #1E293B; margin-bottom: 14px; display: flex; align-items: center; gap-6px; gap: 6px; }
  .plan-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #F1F5F9; font-size: 13px; }
  .plan-row:last-of-type { border-bottom: none; }
  .plan-label { color: #64748B; }
  .plan-val   { font-weight: 600; color: #1E293B; }
  .plan-val.green { color: #16A34A; }
  .plan-note  { font-size: 12px; color: #64748B; margin: 10px 0 14px; line-height: 1.4; }
  .plan-actions { display: flex; gap: 10px; }
  .btn-confirm    { flex: 1; padding: 11px; background: #16A34A; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
  .btn-confirm:hover    { background: #15803D; }
  .btn-renegotiate { flex: 1; padding: 11px; background: #fff; color: #64748B; border: 1px solid #E2E8F0; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .btn-renegotiate:hover { background: #F8FAFC; }

  /* Payment link card */
  .payment-card { background: #DCFCE7; border: 1px solid #86EFAC; border-radius: 12px; padding: 16px; margin: 4px 0 8px 38px; max-width: 360px; }
  .payment-card h3 { font-size: 15px; font-weight: 700; color: #166534; margin-bottom: 10px; }
  .payment-card p  { font-size: 13px; color: #166534; margin-bottom: 12px; line-height: 1.4; }
  .btn-pay { display: block; width: 100%; border: none; cursor: pointer; font-family: inherit; background: #16A34A; color: #fff; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 14px; text-align: center; transition: background 0.15s; }
  .btn-pay:hover { background: #15803D; }
  .deferred-note { font-size: 12px; color: #166534; margin-top: 10px; padding-top: 10px; border-top: 1px solid #86EFAC; }

  /* Status screens */
  .status-screen { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 16px; padding: 40px 20px; text-align: center; }
  .status-icon   { font-size: 56px; }
  .status-title  { font-size: 20px; font-weight: 700; color: #1E293B; }
  .status-sub    { font-size: 14px; color: #64748B; max-width: 320px; line-height: 1.5; }

  /* Typing indicator */
  .typing { display: none; align-items: center; gap: 4px; padding: 10px 14px; background: #F3F4F6; border-radius: 12px; width: fit-content; }
  .typing span { width: 6px; height: 6px; background: #94A3B8; border-radius: 50%; animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

  /* Input area */
  .input-area { background: #fff; border-top: 1px solid #E2E8F0; padding: 12px 16px; display: none; gap: 10px; align-items: flex-end; flex-shrink: 0; }
  .input-area.visible { display: flex; }
  #msg-input { flex: 1; border: 1px solid #E2E8F0; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-family: 'Inter', sans-serif; outline: none; resize: none; line-height: 1.4; max-height: 120px; color: #1E293B; }
  #msg-input:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
  #send-btn { background: #2563EB; color: #fff; border: none; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
  #send-btn:hover { background: #1D4ED8; }
  #send-btn:disabled { background: #93C5FD; cursor: not-allowed; }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-logo">🔄 RecoverFlow</div>
  <div class="topbar-sub">Secure Payment Recovery</div>
</div>

<!-- Invoice summary -->
<div class="invoice-card" id="invoice-card" style="display:none">
  <div class="inv-field">
    <span class="inv-label">Invoice</span>
    <span class="inv-value" id="inv-id">—</span>
  </div>
  <div class="inv-field">
    <span class="inv-label">Amount</span>
    <span class="inv-value" id="inv-amount">—</span>
  </div>
  <div class="inv-field">
    <span class="inv-label">Overdue</span>
    <span class="inv-value overdue" id="inv-dpd">—</span>
  </div>
  <div class="inv-field">
    <span class="inv-label">Debtor</span>
    <span class="inv-value" id="inv-debtor">—</span>
  </div>
</div>

<!-- Chat window -->
<div class="chat-area" id="chat-area"></div>

<!-- Input area -->
<div class="input-area" id="input-area">
  <textarea id="msg-input" rows="1" placeholder="Type your message…"></textarea>
  <button id="send-btn" onclick="sendMessage()">Send ↑</button>
</div>

<!-- Status screens (hidden until needed) -->
<div class="status-screen" id="screen-settled">
  <div class="status-icon">✅</div>
  <div class="status-title">Payment Arranged</div>
  <div class="status-sub" id="settled-msg">Thank you for settling this.</div>
</div>
<div class="status-screen" id="screen-disputed">
  <div class="status-icon">📋</div>
  <div class="status-title">Query Raised</div>
  <div class="status-sub">Your query has been raised. Our team will contact you within 24 hours.</div>
</div>
<div class="status-screen" id="screen-escalated">
  <div class="status-icon">📞</div>
  <div class="status-title">Escalated</div>
  <div class="status-sub">Our team will reach out to you shortly to resolve this.</div>
</div>

<script>
const INVOICE_ID = "__INVOICE_ID__";

let sessionId   = null;
let debtorName  = "";
let amountPaise = 0;
let currentOrder = null;   // order info for the active Razorpay Checkout

// ── Indian number formatting ─────────────────────────────────────────────────
function fmtRupees(paise) {
  const rupees = Math.floor(paise / 100);
  let s = String(rupees);
  if (s.length <= 3) return "₹" + s;
  let result = s.slice(-3);
  s = s.slice(0, -3);
  while (s.length > 2) { result = s.slice(-2) + "," + result; s = s.slice(0, -2); }
  return "₹" + s + "," + result;
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
}

// ── DOM helpers ──────────────────────────────────────────────────────────────
const chatArea  = document.getElementById("chat-area");
const inputArea = document.getElementById("input-area");
const msgInput  = document.getElementById("msg-input");
const sendBtn   = document.getElementById("send-btn");

function addBubble(role, text, extra) {
  const wrap = document.createElement("div");
  wrap.className = `bubble-wrap ${role}`;
  const avatar = document.createElement("div");
  avatar.className = `avatar ${role}`;
  avatar.textContent = role === "agent" ? "🤖" : "👤";
  const bubble = document.createElement("div");
  bubble.className = `bubble ${role}`;
  bubble.textContent = text;
  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  chatArea.appendChild(wrap);
  if (extra) { chatArea.appendChild(extra); }
  scrollDown();
  return wrap;
}

function scrollDown() { chatArea.scrollTop = chatArea.scrollHeight; }

function showIntentButtons() {
  const div = document.createElement("div");
  div.className = "intent-buttons";
  div.id = "intent-btns";
  div.innerHTML = `
    <button class="btn-intent btn-full"    onclick="selectIntent('A')">✅ Pay ${fmtRupees(amountPaise)} in Full</button>
    <button class="btn-intent btn-partial" onclick="selectIntent('B')">🔄 Pay Partially</button>
  `;
  chatArea.appendChild(div);
  scrollDown();
}

function removeIntentButtons() {
  const el = document.getElementById("intent-btns");
  if (el) el.remove();
}

function showTyping() {
  const t = document.createElement("div");
  t.className = "bubble-wrap agent"; t.id = "typing-ind";
  t.innerHTML = `<div class="avatar agent">🤖</div>
    <div class="typing" style="display:flex"><span></span><span></span><span></span></div>`;
  chatArea.appendChild(t);
  scrollDown();
  return t;
}

function removeTyping() {
  const el = document.getElementById("typing-ind");
  if (el) el.remove();
}

function showPlanCard(plan) {
  const card = document.createElement("div");
  card.className = "plan-card";
  card.id = "plan-card";

  const deferredZero = plan.deferred_amount === 0;
  const discountZero = (plan.discount_amount || 0) === 0;

  let rows = `
    <div class="plan-title">📋 Your Payment Arrangement</div>
    <div class="plan-row"><span class="plan-label">💰 Pay now (today)</span><span class="plan-val green">${plan.upfront_display}</span></div>`;

  if (deferredZero) {
    rows += `
    <div class="plan-row"><span class="plan-label">✅ Full invoice settled</span><span class="plan-val green">No deferred payment</span></div>`;
  } else {
    rows += `
    <div class="plan-row"><span class="plan-label">📅 Pay later (${fmtDate(plan.deferred_due_date)})</span><span class="plan-val">${plan.deferred_display}</span></div>`;
    if (!discountZero) {
      rows += `
    <div class="plan-row"><span class="plan-label">🏷️ Discount</span><span class="plan-val">${plan.discount_display}</span></div>`;
    }
    rows += `
    <div class="plan-row"><span class="plan-label">📊 Total payable</span><span class="plan-val">${plan.total_display}</span></div>`;
  }

  const note = deferredZero
    ? `By confirming, you agree to pay the full invoice amount now.`
    : `By confirming, you agree to pay ${plan.deferred_display} by ${fmtDate(plan.deferred_due_date)}. Paying on time improves your account standing.`;

  const confirmLabel = deferredZero
    ? `✅ Agree &amp; Pay ${plan.upfront_display} in Full`
    : `✅ Agree &amp; Pay ${plan.upfront_display} Now`;

  card.innerHTML = `
    ${rows}
    <div class="plan-note">${note}</div>
    <div class="plan-actions">
      <button class="btn-confirm"     onclick="confirmPlan()">${confirmLabel}</button>
      <button class="btn-renegotiate" onclick="rejectPlan()">✏️ Renegotiate</button>
    </div>
  `;
  chatArea.appendChild(card);
  scrollDown();
}

function removePlanCard() {
  const el = document.getElementById("plan-card");
  if (el) el.remove();
}

function showPaymentButton(order, plan) {
  currentOrder = order;
  const deferredNote = (plan && plan.deferred_amount > 0)
    ? `<div class="deferred-note">📅 Reminder: ${plan.deferred_display} due by ${fmtDate(plan.deferred_due_date)}. Paying on time improves your account standing.</div>`
    : "";
  const card = document.createElement("div");
  card.className = "payment-card";
  card.id = "payment-card";
  card.innerHTML = `
    <h3>💳 Complete Your Payment</h3>
    <p>Click below to pay ${order.amount_display} securely via Razorpay.</p>
    <button class="btn-pay" onclick="openRazorpayCheckout()">Pay Now →</button>
    ${deferredNote}
  `;
  chatArea.appendChild(card);
  scrollDown();
}

function openRazorpayCheckout() {
  const orderData = currentOrder;
  if (!orderData) return;
  const options = {
    key: orderData.key_id,
    amount: Math.round(orderData.amount * 100),   // paise
    currency: "INR",
    order_id: orderData.order_id,
    name: "RecoverFlow",
    description: "Invoice Settlement: " + orderData.invoice_id,
    prefill: { name: orderData.debtor_name },
    theme: { color: "#2563eb" },
    handler: function(response) {
      showPaymentSuccess(response.razorpay_payment_id);
      fetch("/api/payment-confirmed", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          payment_id: response.razorpay_payment_id,
          order_id: orderData.order_id,
          session_id: sessionId
        })
      }).catch(err => console.error("payment-confirmed failed", err));
    }
  };
  const rzp = new Razorpay(options);
  rzp.open();
}

function showPaymentSuccess(paymentId) {
  const card = document.getElementById("payment-card");
  if (card) card.remove();
  const el = document.createElement("div");
  el.className = "payment-card";
  el.innerHTML = `
    <h3>✅ Payment Successful</h3>
    <p>Payment ID: ${paymentId}</p>
    <p>Thank you for your payment!</p>
  `;
  chatArea.appendChild(el);
  scrollDown();
}

function showStatusScreen(type, extra) {
  document.getElementById("chat-area").style.display   = "none";
  document.getElementById("input-area").style.display  = "none";
  document.getElementById(`screen-${type}`).style.display = "flex";
  if (type === "settled" && extra) {
    document.getElementById("settled-msg").textContent = extra;
  }
}

// ── API calls ────────────────────────────────────────────────────────────────
async function initChat() {
  const res  = await fetch(`/api/negotiate/start/${INVOICE_ID}`, { method: "POST" });
  const data = await res.json();
  sessionId   = data.session_id;
  amountPaise = data.invoice_amount_paise;
  debtorName  = data.debtor_name;

  document.getElementById("inv-id").textContent     = INVOICE_ID;
  document.getElementById("inv-amount").textContent = fmtRupees(amountPaise);
  document.getElementById("inv-dpd").textContent    = data.dpd + " days overdue";
  document.getElementById("inv-debtor").textContent = debtorName;
  document.getElementById("invoice-card").style.display = "flex";

  addBubble("agent", data.opening_message);
  if (data.awaiting_intent) showIntentButtons();
}

async function selectIntent(choice) {
  removeIntentButtons();
  addBubble("debtor", choice === "A" ? "Pay in Full" : "Discuss a partial arrangement");
  await callTurn(choice);
}

async function confirmPlan() {
  removePlanCard();
  addBubble("debtor", "CONFIRM — I agree to this arrangement.");
  await callTurn("CONFIRM");
}

async function rejectPlan() {
  removePlanCard();
  addBubble("debtor", "I'd like to renegotiate.");
  await callTurn("renegotiate");
}

async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;
  msgInput.value = "";
  msgInput.style.height = "auto";
  addBubble("debtor", text);
  sendBtn.disabled = true;
  await callTurn(text);
  sendBtn.disabled = false;
  msgInput.focus();
}

async function callTurn(message) {
  const t = showTyping();
  try {
    const res = await fetch(`/api/negotiate/turn/${sessionId}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message }),
    });
    const data = await res.json();
    removeTyping();

    addBubble("agent", data.agent_reply);

    if (data.awaiting_plan_confirmation && data.pending_plan) {
      showPlanCard(data.pending_plan);
    } else if (data.payment_order) {
      showPaymentButton(data.payment_order, data.agreed_terms);
    }

    const status = data.session_status;
    if (status === "settled") {
      inputArea.classList.remove("visible");
      setTimeout(() => showStatusScreen("settled", `✅ Payment arranged. Thank you, ${debtorName}.`), 1800);
    } else if (status === "awaiting_payment" || status === "partially_settled") {
      inputArea.classList.remove("visible");
    } else if (status === "disputed") {
      inputArea.classList.remove("visible");
      setTimeout(() => showStatusScreen("disputed"), 1500);
    } else if (status === "escalated") {
      inputArea.classList.remove("visible");
      setTimeout(() => showStatusScreen("escalated"), 1500);
    } else if (!data.awaiting_plan_confirmation) {
      inputArea.classList.add("visible");
      msgInput.focus();
    }
  } catch (err) {
    removeTyping();
    addBubble("agent", "⚠️ Connection error. Please try again.");
    console.error(err);
  }
}

// ── Auto-resize textarea ─────────────────────────────────────────────────────
msgInput.addEventListener("input", () => {
  msgInput.style.height = "auto";
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + "px";
});
msgInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ── Boot ─────────────────────────────────────────────────────────────────────
initChat();
</script>
</body>
</html>
